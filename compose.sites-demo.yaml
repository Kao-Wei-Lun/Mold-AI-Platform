name: mold-ai-platform-sites-demo

services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  qdrant:
    restart: unless-stopped

  api:
    build:
      context: ./services/platform-api
      target: production
    restart: unless-stopped
    command: ["./scripts/start-api-sites-demo.sh"]
    volumes: !override
      - runtime-data:/data
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request=urllib.request.Request('http://localhost:8000/api/v1/health/live', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      APP_ENV: external-demo
      APP_VERSION: ${APP_VERSION:-0.13.0-demo}
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: .trycloudflare.com,api,localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_ENTRY_BASE_URL:?Set PUBLIC_WEB_ENTRY_BASE_URL}
      DEMO_AUTH_MODE: required
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?Set DEMO_API_TOKEN}
      DEMO_API_TOKEN_SCOPES: public-demo:read,public-demo:write
      DEMO_API_ACTOR_ID: controlled-sites-demo-user
      TRUST_PROXY_HEADERS: "true"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_COOKIE_SECURE: "true"
      DJANGO_SECURE_HSTS_SECONDS: "86400"
      QUICK_TUNNEL_MODE: "true"
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_ENTRY_BASE_URL:?Set PUBLIC_WEB_ENTRY_BASE_URL}
      PUBLIC_MCP_BASE_URL: ""
      SECURE_MCP_TUNNEL_ID: ${SECURE_MCP_TUNNEL_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      OPENAI_MAX_INPUT_CHARS: ${OPENAI_MAX_INPUT_CHARS:-24000}
      OPENAI_MAX_CONCURRENCY: ${OPENAI_MAX_CONCURRENCY:-2}
      OPENAI_PROVIDER_PROFILE: ${OPENAI_PROVIDER_PROFILE:-openai-demo-public-v1}
      OPENAI_PROMPT_PROFILE: ${OPENAI_PROMPT_PROFILE:-mold-assistant-grounded-v1}

  worker:
    build:
      context: ./services/platform-api
      target: production
    restart: unless-stopped
    volumes: !override
      - runtime-data:/data

  worker-cad:
    build:
      context: ./services/platform-api
      target: production
    restart: unless-stopped
    volumes: !override
      - runtime-data:/data

  mcp-gateway:
    build:
      context: ./services/platform-api
      target: production
    restart: unless-stopped
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${MCP_HOST_PORT:-8002}:8001"
    environment:
      PLATFORM_API_TOKEN: ${DEMO_API_TOKEN:?Set DEMO_API_TOKEN}
      PLATFORM_API_FORWARDED_PROTO: https
      PUBLIC_WEB_ENTRY_BASE_URL: ${PUBLIC_WEB_ENTRY_BASE_URL:?Set PUBLIC_WEB_ENTRY_BASE_URL}
      SECURE_MCP_TUNNEL_ID: ${SECURE_MCP_TUNNEL_ID:-}
      MCP_AUTH_MODE: none
      MCP_BIND_HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,mcp-gateway:*
      MCP_ALLOWED_ORIGINS: http://localhost:*

  web:
    build:
      context: ./apps/web
      target: production
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    volumes: !reset []
    ports: !reset []
    depends_on:
      api:
        condition: service_healthy

  web-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8080"]
    depends_on:
      web:
        condition: service_started
    networks: [frontend]
