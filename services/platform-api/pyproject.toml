[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mold-ai-platform-api"
version = "0.1.0"
description = "Backend and worker foundation for Mold AI Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2.17,<5.3",
  "djangorestframework>=3.18.0,<3.19",
  "django-cors-headers>=4.7,<5",
  "celery[redis]>=5.6.3,<5.7",
  "psycopg[binary]>=3.2,<3.4",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["mold_platform*", "platform_core*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mold_platform.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]
