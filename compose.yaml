name: mold-ai-platform

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mold_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mold_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mold_ai_demo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mold_ai} -d ${POSTGRES_DB:-mold_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.15.4
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]

  api:
    build:
      context: ./services/platform-api
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mold_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mold_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mold_ai_demo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      QDRANT_CAD_COLLECTION: cad-similarity-v1
      SIMILARITY_INDEX_VERSION: cad-demo-v1
      SIMILARITY_AUTO_INDEX: "true"
      ARTIFACT_STORAGE_ROOT: /data/artifacts
    command: ["./scripts/start-api.sh"]
    volumes:
      - ./services/platform-api:/app
      - runtime-data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [frontend, backend]

  worker:
    build:
      context: ./services/platform-api
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mold_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mold_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mold_ai_demo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      QDRANT_CAD_COLLECTION: cad-similarity-v1
      SIMILARITY_INDEX_VERSION: cad-demo-v1
      SIMILARITY_AUTO_INDEX: "true"
      ARTIFACT_STORAGE_ROOT: /data/artifacts
    command: ["celery", "-A", "mold_platform", "worker", "--loglevel=INFO", "--queues=general", "--concurrency=2"]
    volumes:
      - ./services/platform-api:/app
      - runtime-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  worker-cad:
    build:
      context: ./services/platform-api
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mold_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mold_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mold_ai_demo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      QDRANT_CAD_COLLECTION: cad-similarity-v1
      SIMILARITY_INDEX_VERSION: cad-demo-v1
      SIMILARITY_AUTO_INDEX: "true"
      ARTIFACT_STORAGE_ROOT: /data/artifacts
    command:
      [
        "celery",
        "-A",
        "mold_platform",
        "worker",
        "--loglevel=INFO",
        "--queues=cad",
        "--concurrency=1",
        "--max-tasks-per-child=20",
      ]
    volumes:
      - ./services/platform-api:/app
      - runtime-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  runtime-data:
  web-node-modules:
